[package]
name = "lumasync"
version = "1.5.5-rc.3"
description = "LumaSync — screen-synced ambient lighting for WS2812B LEDs and Philips Hue"
authors = ["voyvodka"]
edition = "2021"
homepage = "https://lumasync.app"
repository = "https://github.com/voyvodka/LumaSync"
license = "MIT"
readme = "../README.md"
keywords = ["ambilight", "tauri", "led", "ws2812b", "philips-hue"]
categories = ["gui", "multimedia"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumasync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
openssl = { version = "0.10", features = ["vendored"] }
# `signal` enables tokio::signal::ctrl_c() / unix SIGTERM handling, used by the
# debug-only orderly-shutdown hook in lib.rs (dev terminal Ctrl+C should run
# safe_quit drop guards instead of orphaning the NSApplication run loop).
#
# `sync` backs the single-flight slot lock in `commands::hue::area_cache`
# (an async mutex is required — the guard is held across the bridge fetch).
tokio = { version = "1.52.3", features = ["rt", "signal", "sync"] }
# v1.5 W2-A1 — OS keychain abstraction for Hue credentials.
# Enabled backends: macOS Security.framework, Windows CredMan, Linux Secret Service (libsecret via D-Bus).
#
# keyring 4 restructured the crate: the classic `Entry`/`Error` API now lives
# behind the `v1` feature (re-exported at the crate root via `pub use v1::*`,
# so `keyring::Entry` / `keyring::Error::NoEntry` resolve unchanged), and the
# v3 backend feature names were replaced by `*-keyring-store` crates.
# v3 -> v4 backend feature mapping:
#   apple-native   -> apple-native-keyring-store       (NOT in the v4 default set; added explicitly for macOS Keychain Services)
#   windows-native -> windows-native-keyring-store     (in v4 default set)
#   linux-native   -> zbus-secret-service-keyring-store (in v4 default set; Secret Service over D-Bus, same backend as before)
# The default feature set (`v1` + windows-native + zbus-secret-service) is kept
# on; we only add the macOS backend that the default set omits.
keyring = { version = "4", features = ["apple-native-keyring-store"] }
# v1.5 W2-A3 — pure-Rust mDNS responder for LAN bridge discovery.
# Used by `_hue._tcp.local.` (Hue) today; the shared `network::mdns` registry
# also serves the future WLED `_wled._tcp.local.` browser (D5 — single
# responder per process to avoid macOS SO_REUSEPORT contention).
# Caret, never exact: an exact pin blocks Dependabot carrying a security patch.
# This crate has moved its consumer surface across minors before (0.13→0.19 took
# ScopedIpV4/ResolvedService), so review a minor against `network::mdns`.
mdns-sd = "0.20"
uuid = { version = "1", features = ["v4"] }
# Gated behind the `e2e` feature — see [features] below.
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "8.0.0"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSControl", "NSButton", "NSView"] }

[target.'cfg(target_os = "linux")'.dependencies]
xcap = "0.9.6"

[features]
# Embeds a W3C WebDriver server in the binary for the `pnpm e2e` suite. Off by
# default and never enabled by `tauri build`, so release bundles never carry it.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
# MockRuntime for the IPC tests in `src/ipc_tests/`. Dev-only is load-bearing:
# resolver v2 keeps the `test` feature out of the normal build graph, so the
# shipped binary never links the mock runtime.
tauri = { version = "2", features = ["test"] }
tokio = { version = "1.52.3", features = ["rt", "macros", "sync", "time"] }
