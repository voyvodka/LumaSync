name: License Scan

# Weekly rather than per-PR: `dependency-review` already gates changed
# dependencies on every PR. This is the full-tree backstop for what that check
# structurally cannot see.
on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    branches:
      - main
    paths:
      - "src-tauri/Cargo.lock"
      - "src-tauri/deny.toml"
      - "bun.lock"
      - ".github/workflows/license-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo:
    name: Cargo licenses, sources and bans (full tree)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      # `advisories` is left to cargo audit in ci.yml, which carries the one
      # ignore list. Sources pins the tree to crates.io; bans denies wildcard
      # requirements and only warns on duplicate versions (see deny.toml).
      - name: Check licenses, sources and bans
        working-directory: src-tauri
        run: cargo deny check licenses sources bans

  npm:
    name: npm licenses (full tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # Kept deliberately: vitest, wdio and the Tauri CLI still resolve through a
      # Node shebang, so removing this breaks the run even though Bun installs.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check licenses
        run: |
          # OFL-1.1 covers the bundled IBM Plex fonts — a font licence, not an
          # application one; it never reaches the compiled bundle's terms.
          bunx license-checker-rseidelsohn \
            --production \
            --onlyAllow "MIT;MIT-0;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;BlueOak-1.0.0;CC0-1.0;Unlicense;Python-2.0;OFL-1.1" \
            --excludePrivatePackages
