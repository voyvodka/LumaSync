name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Permissive only: the union of `src-tauri/deny.toml` `allow` (Rust)
          # and license-scan.yml's npm `--onlyAllow`, so this gate refuses
          # nothing the full-tree scan accepts. GPL, LGPL, AGPL, EUPL and SSPL
          # are rejected by being absent. `deny-licenses` is deprecated upstream
          # (#938), hence the allow-list. Its cost: a changed dependency whose
          # licence GitHub cannot map to one of these (a legacy "MIT/Apache-2.0"
          # slash string becomes a LicenseRef) fails here and is named in the
          # log; add its purl below with a reason rather than widening the list.
          allow-licenses: MIT, MIT-0, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause, BSD-3-Clause, 0BSD, ISC, CC0-1.0, CDLA-Permissive-2.0, MPL-2.0, Unicode-3.0, Unlicense, Zlib, BlueOak-1.0.0, Python-2.0, OFL-1.1
          # unescaper (via serialport) and jszip (via webdriverio) are dual
          # "MIT OR GPL-3.0-*" and we take the MIT arm; an allow-list already
          # resolves the OR that way, so these two stay only as a record of the
          # decision. Swatinem/rust-cache (LGPL-3.0) is a CI action: it runs on
          # the runner and is never linked or shipped.
          allow-dependencies-licenses: pkg:cargo/unescaper, pkg:npm/jszip, pkg:githubactions/Swatinem/rust-cache
          comment-summary-in-pr: on-failure
