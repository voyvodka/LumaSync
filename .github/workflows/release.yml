name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Pin the macOS deployment target at the workflow level so it is a real OS
# environment variable inherited by every rustc/swiftc/ld invocation in the
# universal release build. This is the outermost belt in a belt-and-suspenders
# guard against the 1.5.2 launch crash (issue #115): linking with a deployment
# target < 12.0 back-deploys libswift_Concurrency to an `@rpath` that only
# exists on the build machine, so dyld aborts at launch on users' machines.
# Tauri's bundler would otherwise inject the 10.13 default; a process-level env
# var beats both that and any Cargo `[env]` precedence quirk. Harmless on
# Linux/Windows. A post-build otool guard below verifies the result.
env:
  MACOSX_DEPLOYMENT_TARGET: "12.3"

# A tag push must NEVER be cancelled mid-flight (would leave a half-published
# release on GitHub). The group is per-ref so two concurrent tag pushes
# serialise rather than racing for the same release artefacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The three version locations move in lockstep by convention only: a
      # `v1.5.4` tag on a 1.5.5 tree published a mislabelled release, all green.
      - name: Verify the tag matches the in-tree version
        shell: bash
        run: |
          set -euo pipefail

          # Core X.Y.Z only: `v1.5.4-rc.1` is cut from a tree reading `1.5.4`,
          # and nothing in-tree records the suffix to check it against.
          core() { printf '%s' "${1%%[-+]*}"; }

          TAG_VERSION=$(core "${GITHUB_REF_NAME#v}")
          # Every pattern ends in `.*` so it also absorbs the CR the Windows
          # runner leaves on each line.
          PKG_VERSION=$(core "$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' package.json)")
          # Anchored at column 0: a dependency's `version = ` sits inside an
          # inline table and is always indented or preceded by a key.
          CARGO_VERSION=$(core "$(sed -n 's/^version = "\([^"]*\)".*/\1/p' src-tauri/Cargo.toml)")
          # `current:` is the one place SECURITY.md names an exact release; the
          # other rows of the support table are ranges (`1.5.x`, `< 1.4.0`).
          SEC_VERSION=$(core "$(sed -n 's/.*(current: \([0-9][^)]*\)).*/\1/p' SECURITY.md)")

          echo "tag=${TAG_VERSION} package.json=${PKG_VERSION} Cargo.toml=${CARGO_VERSION} SECURITY.md=${SEC_VERSION}"

          FAILED=0
          for pair in "package.json:${PKG_VERSION}" "src-tauri/Cargo.toml:${CARGO_VERSION}" "SECURITY.md:${SEC_VERSION}"; do
            file="${pair%%:*}"
            found="${pair#*:}"
            if [ -z "$found" ]; then
              echo "::error::could not read a version out of ${file}"
              FAILED=1
            elif [ "$found" != "$TAG_VERSION" ]; then
              echo "::error::${file} says ${found} but the tag says ${TAG_VERSION}"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the in-tree version; refusing to build."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Mirror ci.yml so the release matrix can re-use the per-OS cache
          # the CI job populated against the same Cargo.lock. v1.6: busted
          # alongside ci.yml for the Xcode-26 rebuild of the upgraded deps.
          prefix-key: v1.6-rust-cache
          shared-key: ${{ matrix.os }}

      - name: Install Linux deps for Tauri bundle + xcap (X11 capture)
        if: matrix.os == 'ubuntu-24.04'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # xvfb + dbus-x11 are for the AppImage smoke test, not the bundle: the
          # app needs a display to open its window and a session bus for the tray.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxrandr-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libgbm-dev \
            xvfb \
            dbus-x11

      - name: Install macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Select Xcode 26 (macOS 26 SDK for screencapturekit 8 / apple-metal)
        if: matrix.os == 'macos-latest'
        run: |
          # See ci.yml: screencapturekit 8 -> apple-metal 0.8.8 needs the
          # macOS 26 SDK at compile time (Metal 4 sampler APIs behind an
          # `#available(macOS 26.0, *)` guard). Select the newest installed
          # Xcode so the universal release build links the correct SDK; the
          # availability guard keeps the binary runnable on older macOS.
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$latest" ]; then latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Rust check (cargo check)
        run: pnpm check:rust

      - name: Rust format check (cargo fmt)
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Rust lint (cargo clippy -D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: Rust tests (cargo test)
        run: cargo test --all-features -- --test-threads=1
        working-directory: src-tauri

      # Frontend-only verification — Linux runner is enough; running it on
      # all three platforms in the release matrix wastes ~2-4 min per build
      # without adding signal (the CI gate already covers cross-platform
      # parity for these JS-only checks).
      - name: Verify shell contracts (Linux only)
        if: matrix.os == 'ubuntu-24.04'
        run: pnpm verify:shell-contracts

      - name: Run frontend tests (Linux only)
        if: matrix.os == 'ubuntu-24.04'
        run: pnpm vitest run

      - name: Rust audit (Linux only)
        if: matrix.os == 'ubuntu-24.04'
        working-directory: src-tauri
        run: |
          cargo install --locked cargo-audit
          cargo audit

      - name: Detect release channel from tag
        id: channel
        shell: bash
        run: |
          # v1.5 W2-C6 — derive the release channel from the tag suffix so
          # `vX.Y.Z` lands as a stable GitHub Release while `vX.Y.Z-beta.N`,
          # `vX.Y.Z-rc.N`, etc. land flagged as prerelease. Tauri updater on
          # the user side keeps reading `latest.json` (stable) until a
          # follow-up Rust-side dynamic-endpoint commit teaches it to fan
          # out to `latest-beta.json` for opted-in installs.
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: bash
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          NOTES=$(awk "/^## \[${VERSION}\]/{p=1; next} /^## \[/{if(p) exit} /^---$/{if(p) exit} p" CHANGELOG.md)
          # Previously a placeholder string, so a release with no section shipped
          # to users with no notes and nothing failed. Blanks are stripped first:
          # a heading with an empty body yields newlines, not an empty string.
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no non-empty '## [${VERSION}]' section; refusing to release."
            exit 1
          fi
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Pinned to a commit, unlike the other actions here: this is the only step
      # handed TAURI_SIGNING_PRIVATE_KEY, the trust anchor for every auto-update
      # the app performs. Move the SHA and the version comment together.
      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LumaSync ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          # Draft until the `publish` job below: a draft is excluded from
          # `/releases/latest/download/latest.json`, so the updater feed never
          # sees a half-filled `platforms` map while other matrix jobs build.
          releaseDraft: true
          prerelease: ${{ steps.channel.outputs.is_prerelease }}
          # Tag re-runs and the 2nd/3rd matrix entry are safe without an opt-in flag:
          # the action gets-or-creates by tag and replaces same-named assets.
          args: ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}

      # Issue #115 gate: fails if the binary has minos < 12.0 or references
      # @rpath/libswift_Concurrency. Failing here keeps the release a draft.
      - name: Verify macOS Swift runtime linkage (guard against #115 regression)
        if: matrix.os == 'macos-latest'
        run: |
          BIN="src-tauri/target/universal-apple-darwin/release/lumasync"
          if [ ! -f "$BIN" ]; then
            echo "Universal binary not found at $BIN; listing candidates:" >&2
            find src-tauri/target -maxdepth 4 -name lumasync -type f >&2 || true
            exit 1
          fi
          bash scripts/verify/macos-swift-runtime.sh "$BIN"

      # These run post-upload like the guard above — safe, because the upload
      # went into a draft that `publish` only undrafts if this job is green.
      # --hard-kill: the SIGINT shutdown hook is debug-only (ci.yml covers it).
      - name: Launch smoke test on the mounted .dmg
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          DMGDIR=src-tauri/target/universal-apple-darwin/release/bundle/dmg
          DMG=$(ls "$DMGDIR"/*.dmg 2>/dev/null | head -1 || true)
          [ -n "$DMG" ] || { echo "::error::no .dmg under $DMGDIR"; exit 1; }
          MNT="$(mktemp -d)"
          # Detach even on failure, or the volume stays busy for later steps.
          trap 'hdiutil detach "$MNT" -force >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly -quiet
          APP=$(ls -d "$MNT"/*.app | head -1)
          # Globbed, not hardcoded: the inner executable is named after the cargo
          # package (`lumasync`), not after productName.
          EXE=$(ls "$APP"/Contents/MacOS/* | head -1)
          node scripts/verify/launch-smoke.mjs \
            --binary "$EXE" \
            --log-file "$HOME/Library/Logs/com.lumasync.app/lumasync.log" \
            --hard-kill

      - name: Launch smoke test on the AppImage
        if: matrix.os == 'ubuntu-24.04'
        env:
          # ubuntu-24.04 ships FUSE 3 only and the AppImage runtime wants FUSE 2.
          # Extracting runs the same shipped payload without coupling the release
          # to whether the runner can mount; the FUSE path is the runtime's
          # problem, not ours.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Xvfb has no GPU, and WebKit's accelerated compositor and DMA-BUF
          # renderer both abort without one, taking the webview down with them.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          set -euo pipefail
          IMGDIR=src-tauri/target/release/bundle/appimage
          APPIMAGE=$(ls "$IMGDIR"/*.AppImage 2>/dev/null | head -1 || true)
          [ -n "$APPIMAGE" ] || { echo "::error::no .AppImage under $IMGDIR"; exit 1; }
          chmod +x "$APPIMAGE"
          xvfb-run -a dbus-run-session -- node scripts/verify/launch-smoke.mjs \
            --binary "$APPIMAGE" \
            --log-file "$HOME/.local/share/com.lumasync.app/logs/lumasync.log" \
            --hard-kill

      # Windows has no launch smoke step — see #181.

  publish:
    name: Publish release
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The single point where a build becomes visible to the updater. Assert
      # every platform is present first — a merge regression in tauri-action
      # would otherwise ship a feed that silently skips a whole OS.
      - name: Verify the updater feed covers every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p latest.json -O latest.json
          for key in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            if ! jq -e --arg k "$key" '.platforms[$k]' latest.json >/dev/null; then
              echo "::error::latest.json is missing platform '$key'; refusing to publish." >&2
              jq -r '.platforms | keys[]' latest.json >&2
              exit 1
            fi
          done
          echo "latest.json covers $(jq -r '.platforms | keys | length' latest.json) platform keys."

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
